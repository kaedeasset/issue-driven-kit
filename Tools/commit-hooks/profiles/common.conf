# 全部のフレームワークに共通の値（3 段目）。名前は全部ここに置く。フレームワーク別は profiles/<名>/profile.conf、
# repo だけの違いは repo の直下の commit-hooks.conf で上書きする。書き方: 名前=値。# の行と空行は読まない。

# 件名の種類（| で区切る）
types=feat|fix|docs|refactor|chore|test
# 件名の説明（": " より後）の字数の上限
subject_max=40
# 1 ファイルの大きさ（MiB）。超えたら止める（P3）・超えたら警告だけ
size_fail_mib=95
size_warn_mib=50
# 秘密として止めるファイル名を足す（ファイル名〈フォルダを除く〉への正規表現 ERE。空なら足さない）（P2）
secret_extra=
# 生成物として止めるパス（repo の直下からのパスへの正規表現 ERE。空なら止めない）（P4）
generated=
# Unity の .meta の対応を検査する（yes|no）（P5）
meta_pair=no
# 1 アクタ 1 ファイルのマップの載せ漏れを警告する（yes|no）（P6・Unreal）
ofpa_check=no
# LFS の対象（filter=lfs）なのに中身がそのまま入るのを止める（yes|no）（P7）。LFS を使わない repo では何も起きない
lfs_check=yes
# OS が作るファイル（Mac の .DS_Store・._*、Windows の Thumbs.db・desktop.ini）。どの profile でも generated と一緒に止める（P4）
generated_os=(^|/)(\.DS_Store|\._[^/]*|Thumbs\.db|ehthumbs\.db|[Dd]esktop\.ini)$
