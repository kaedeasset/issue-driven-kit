# commit-hooks の設定のうち、この repo だけの違い（1 段目・いちばん優先）。install.sh が repo の直下に commit-hooks.conf として写す。
# commit-hooks の更新（subtree pull）では上書きされない。フレームワーク別の値は profiles/<profile>/profile.conf、
# 全部の名前と既定は profiles/common.conf。上書きしたい名前だけここに書く。書き方: 名前=値。

profile=node

# 例: 種類を足す
# types=feat|fix|docs|refactor|chore|test|perf
